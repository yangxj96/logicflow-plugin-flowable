name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: |
          test "$(node --version)" = 'v24.14.0'
          test "$(pnpm --version)" = '12.6.0'
      - run: pnpm run build

      - name: Decide npm dist-tag
        id: disttag
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]{8}\.[0-9]+$ ]]; then
            echo "tag=dev" >> $GITHUB_OUTPUT
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            echo "Invalid git tag format: $TAG"
            exit 1
          fi

      - name: Publish to npm
        run: pnpm publish --tag ${{ steps.disttag.outputs.tag }} --access public --provenance --no-git-checks
